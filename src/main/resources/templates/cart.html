<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NeoStore | Cart</title>
  <link rel="stylesheet" th:href="@{/css/neostore.css}">
</head>
<body>
  <div th:replace="fragments/header :: header"></div>

  <main>
    <section class="container cart-layout">
      <div class="cart-items">
        <div class="cart-item" th:each="ci : ${items}">
          <div class="cart-media">
            <img th:src="${ci.product.imageUrl != null ? ci.product.imageUrl : '/img/placeholders/product-default.jpg'}"
                 th:alt="${ci.product.name}">
          </div>

          <div class="cart-body">
            <h3 class="cart-title" th:text="${ci.product.name}">Product</h3>
            <div class="cart-meta">
              <span th:text="'Qty: ' + ${ci.quantity}">Qty</span>
              <span th:text="'Price: ₹' + ${ci.product.price}">Price</span>
              <span th:text="'Line Total: ₹' + ${ci.lineTotal}">Line Total</span>
            </div>

            <!-- ✅ Neatly arranged buttons -->
            <div class="cart-actions" style="display:flex;gap:12px;flex-wrap:wrap;margin-top:12px">
              <!-- Remove -->
              <form th:action="@{|/cart/remove/${ci.id}|}" method="post">
                <div th:if="${_csrf != null}">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                </div>
                <button type="submit" class="btn ghost">Remove</button>
              </form>

              <!-- Update -->
              <form th:action="@{|/cart/update/${ci.id}|}" method="post" style="display:flex;gap:8px;align-items:center">
                <div th:if="${_csrf != null}">
                  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                </div>
                <input type="number" name="quantity" th:value="${ci.quantity}" min="1"
                       style="width:64px;padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,0.1);background:transparent;color:#fff" />
                <button type="submit" class="btn primary">Update</button>
              </form>
            </div>
          </div>
        </div>
      </div>

      <aside class="cart-summary">
        <h3>Order Summary</h3>
        <p>Total: <strong th:text="'₹' + ${total}">₹0</strong></p>
        <a class="btn primary large" href="/payment/checkout">Proceed to Pay</a>
      </aside>
    </section>
  </main>

  <div th:replace="fragments/footer :: footer"></div>
</body>
</html>
