<!-- src/main/resources/templates/category.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title th:text="'NeoStore | ' + ${code}">Category</title>
  <link rel="stylesheet" th:href="@{/css/neostore.css}" />
</head>
<body>
  <div th:replace="fragments/header :: header"></div>

  <main class="container">
    <section class="category-header">
      <h2 th:text="${code}">Category</h2>
    </section>

    <section class="card-grid" aria-live="polite">
      <div class="product-card" th:each="p : ${products}">
        <div class="product-media">
          <img th:src="${p.imageUrl != null ? p.imageUrl : '/img/placeholders/product-default.jpg'}" th:alt="${p.name}" />
        </div>

        <div class="product-body">
          <h3 class="product-title" th:text="${p.name}">Product Name</h3>
          <p class="product-desc" th:text="${p.description}">Short description</p>

          <div class="product-meta">
            <span class="price" th:text="'₹' + ${p.price}">₹0</span>
            <span class="brand" th:text="${p.brand}">NeoStore</span>
          </div>

          <div class="product-actions">
  <form th:action="@{|/cart/add/${p.id}|}" method="post">
    <div th:if="${_csrf != null}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    </div>
    <button class="btn primary" type="submit">Add</button>
  </form>

  <form th:action="@{|/wishlist/add/${p.id}|}" method="post">
    <div th:if="${_csrf != null}">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    </div>
    <button class="btn ghost" type="submit">Wishlist</button>
  </form>
</div>

        </div>
      </div>
    </section>
  </main>

  <div th:replace="fragments/footer :: footer"></div>
</body>
</html>
