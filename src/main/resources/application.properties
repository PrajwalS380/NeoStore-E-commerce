spring.application.name=email_verification

# ===============================
# DATABASE (Render MySQL / Neon PG / PlanetScale)
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=${PORT}

# ===============================
# THYMELEAF
# ===============================
spring.thymeleaf.cache=false

# ===============================
# MAIL (Use Gmail App Password)
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8
neostore.mail.from=NeoStore <${MAIL_USERNAME}>
neostore.mail.verifyBaseUrl=${VERIFY_BASE_URL}

# ===============================
# SECURITY
# ===============================
neostore.security.rememberme.key=${REMEMBER_ME_KEY}

# ===============================
# RAZORPAY (SECRET KEYS)
# ===============================
razorpay.key_id=${RAZORPAY_KEY_ID}
razorpay.key_secret=${RAZORPAY_SECRET}
razorpay.currency=INR

# ===============================
# BRANDING
# ===============================
neostore.brand.name=NeoStore

# ===============================
# DEAL PROPERTIES
# ===============================
neostore.deal.title=Singles' Day
neostore.deal.subtitle=ENDS 11TH NOV
neostore.deal.cta=EXTRA 25% OFF ON EVERYTHING*
neostore.deal.note=Discount auto-applied at checkout
spring.mvc.static-path-pattern=/static/**
spring.web.resources.static-locations=classpath:/static/

